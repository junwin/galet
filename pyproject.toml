[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galet"
version = "0.1.0"
description = "Provider-agnostic LLM, embedding, and image generation stack extracted from the Lucy monorepo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "junwin", email = "jdunwin@gmail.com" }]
keywords = ["llm", "openai", "gemini", "mistral", "deepseek", "ollama", "embeddings", "image-generation"]
dependencies = ["openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
openai = ["openai"]
gemini = ["google-genai"]

[project.urls]
Homepage = "https://github.com/junwin/galet"
Repository = "https://github.com/junwin/galet"

[tool.setuptools.packages.find]
where = ["src"]
